    /* ============================================================
       3. UTILITIES
    ============================================================ */
    function uid() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
      return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
    }

    function cn(...values) { return values.filter(Boolean).join(' '); }

    function toLocalDateString(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDate(value) {
      if (!value) return '—';
      const d = new Date(value);
      if (isNaN(d)) return '—';
      return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function formatDateTime(value) {
      if (!value) return '—';
      const d = new Date(value);
      if (isNaN(d)) return '—';
      return d.toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function daysSince(value) {
      const d = new Date(value);
      if (isNaN(d)) return 999;
      return Math.floor((Date.now() - d.getTime()) / 86400000);
    }

    function countStatuses(chapter) {
      return STATUS_META.reduce((total, meta) => total + (chapter.status[meta.key] ? 1 : 0), 0);
    }

    function chapterPercent(chapter) { return (countStatuses(chapter) / 5) * 100; }

    function percentFromChapters(chapters) {
      if (!chapters.length) return 0;
      const total = chapters.reduce((sum, c) => sum + countStatuses(c), 0);
      return (total / (chapters.length * 5)) * 100;
    }

    function countByStatus(chapters, key) {
      return chapters.filter(c => c.status[key]).length;
    }

    function overallStats(chapters) {
      return {
        total: chapters.length,
        percent: percentFromChapters(chapters),
        studied: countByStatus(chapters, 'studied'),
        copy: countByStatus(chapters, 'copy'),
        revised: countByStatus(chapters, 'revised'),
        examReady: countByStatus(chapters, 'examReady'),
        complete: countByStatus(chapters, 'complete'),
        remaining: chapters.length - countByStatus(chapters, 'complete'),
        copyPending: chapters.length - countByStatus(chapters, 'copy'),
        studiedOnly: chapters.filter(c => c.status.studied && !c.status.revised).length,
      };
    }

    function subjectStats(chapters, subjectId) {
      const list = chapters.filter(c => c.subjectId === subjectId);
      return {
        total: list.length,
        percent: percentFromChapters(list),
        studied: countByStatus(list, 'studied'),
        copy: countByStatus(list, 'copy'),
        revised: countByStatus(list, 'revised'),
        examReady: countByStatus(list, 'examReady'),
        complete: countByStatus(list, 'complete'),
        remaining: list.length - countByStatus(list, 'complete'),
        copyPending: list.length - countByStatus(list, 'copy'),
        studiedOnly: list.filter(c => c.status.studied && !c.status.revised).length,
      };
    }

    function bumpStreak(streak, date = new Date()) {
      const today = toLocalDateString(date);
      if (streak.lastStudyDate === today) return streak;
      const yesterday = new Date(date);
      yesterday.setDate(yesterday.getDate() - 1);
      const wasYesterday = streak.lastStudyDate === toLocalDateString(yesterday);
      const current = wasYesterday ? streak.current + 1 : 1;
      const studyDates = Array.from(new Set([...streak.studyDates, today])).sort().slice(-90);
      return {
        current,
        longest: Math.max(streak.longest, current),
        lastStudyDate: today,
        studyDates,
      };
    }

    function lastNDates(n) {
      const dates = [];
      for (let i = n - 1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        dates.push(toLocalDateString(d));
      }
      return dates;
    }

    function getMissionRecommendation(state, chapters) {
      if (!chapters.length) return null;

      // Manual mission always wins
      if (state.mission) {
        const manual = chapters.find(c => c.id === state.mission.chapterId);
        if (manual) {
          return { chapter: manual, score: 999, reasons: ['Manually selected mission'], manual: true };
        }
      }

      const scored = chapters
        .filter(c => !c.status.complete)
        .map(chapter => {
          let score = 0;
          const reasons = [];
          if (chapter.status.studied && !chapter.status.revised) {
            score += 60;
            reasons.push('Studied once but not revised');
          }
          if (!chapter.status.examReady && chapter.status.studied) {
            score += 35;
            reasons.push('Exam readiness pending');
          }
          if (!chapter.status.copy) {
            score += 20;
            reasons.push('Notebook work incomplete');
          }
          if (chapter.weightage === 3) {
            score += 18;
            reasons.push('High-weightage chapter');
          } else if (chapter.weightage === 2) {
            score += 6;
          }
          const idle = daysSince(chapter.lastUpdated);
          if (idle > 14) {
            score += 12;
            reasons.push(`Untouched for ${idle} days`);
          }
          return { chapter, score, reasons, manual: false };
        })
        .sort((a, b) => b.score - a.score);

      return scored[0] || null;
    }

    function getGroups(chapters, subjectId) {
      const source = subjectId ? chapters.filter(c => c.subjectId === subjectId) : chapters;
      return Array.from(new Set(source.map(c => c.group).filter(Boolean))).sort();
    }

       4. STORAGE
    ============================================================ */
    const STORAGE_KEY = 'cbse10-tracker-single-v1';

    const emptyStatus = () => ({
      studied: false, copy: false, revised: false, examReady: false, complete: false,
    });

    function createInitialState() {
      const orderCounter = {};
      const chapters = SYLLABUS_SEED.map(seed => {
        const order = orderCounter[seed.subjectId] || 0;
        orderCounter[seed.subjectId] = order + 1;
        return {
          id: `seed-${seed.subjectId}-${order}-${uid().slice(0, 6)}`,
          subjectId: seed.subjectId,
          group: seed.group,
          name: seed.name,
          topics: [...seed.topics],
          weightage: seed.weightage,
          notes: '',
          testScore: null,
          testDate: null,
          mistakes: '',
          mistakesResolved: false,
          nextAction: '',
          status: emptyStatus(),
          lastUpdated: new Date().toISOString(),
          revisionHistory: [],
          order,
        };
      });

      return {
        version: 1,
        chapters,
        streak: { current: 0, longest: 0, lastStudyDate: null, studyDates: [] },
        mission: null,
      };
    }

    function normalizeStatus(raw) {
      const v = raw || {};
      return {
        studied: Boolean(v.studied),
        copy: Boolean(v.copy),
        revised: Boolean(v.revised),
        examReady: Boolean(v.examReady),
        complete: Boolean(v.complete),
      };
    }

    function normalizeState(raw) {
      const fallback = createInitialState();
      if (!raw || typeof raw !== 'object') return fallback;
      const candidate = raw.state || raw;
      if (!Array.isArray(candidate.chapters)) return fallback;

      const chapters = candidate.chapters.map((item, index) => {
        const c = item || {};
        const subjectId = SUBJECT_MAP[c.subjectId] ? c.subjectId : 'math';
        return {
          id: typeof c.id === 'string' && c.id ? c.id : `imported-${index}-${uid().slice(0, 6)}`,
          subjectId,
          group: typeof c.group === 'string' ? c.group : 'General',
          name: typeof c.name === 'string' && c.name ? c.name : 'Untitled chapter',
          topics: Array.isArray(c.topics) ? c.topics.map(String) : [],
          weightage: [1, 2, 3].includes(Number(c.weightage)) ? Number(c.weightage) : 2,
          notes: typeof c.notes === 'string' ? c.notes : '',
          testScore: typeof c.testScore === 'number' ? c.testScore : null,
          testDate: typeof c.testDate === 'string' ? c.testDate : null,
          mistakes: typeof c.mistakes === 'string' ? c.mistakes : '',
          mistakesResolved: Boolean(c.mistakesResolved),
          nextAction: typeof c.nextAction === 'string' ? c.nextAction : '',
          status: normalizeStatus(c.status),
          lastUpdated: typeof c.lastUpdated === 'string' ? c.lastUpdated : new Date().toISOString(),
          revisionHistory: Array.isArray(c.revisionHistory)
            ? c.revisionHistory
                .filter(e => e && typeof e.date === 'string')
                .map(e => ({
                  id: typeof e.id === 'string' && e.id ? e.id : uid(),
                  date: e.date,
                  note: typeof e.note === 'string' ? e.note : 'Revision',
                }))
            : [],
          order: typeof c.order === 'number' ? c.order : index,
        };
      });

      const streak = candidate.streak || fallback.streak;
      return {
        version: 1,
        chapters,
        streak: {
          current: typeof streak.current === 'number' && streak.current >= 0 ? streak.current : 0,
          longest: typeof streak.longest === 'number' && streak.longest >= 0 ? streak.longest : 0,
          lastStudyDate: typeof streak.lastStudyDate === 'string' ? streak.lastStudyDate : null,
          studyDates: Array.isArray(streak.studyDates) ? streak.studyDates.filter(d => typeof d === 'string') : [],
        },
        mission: candidate.mission && typeof candidate.mission.chapterId === 'string'
          ? {
              chapterId: candidate.mission.chapterId,
              createdAt: typeof candidate.mission.createdAt === 'string' ? candidate.mission.createdAt : new Date().toISOString(),
              note: typeof candidate.mission.note === 'string' ? candidate.mission.note : '',
            }
          : null,
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createInitialState();
        return normalizeState(JSON.parse(raw));
      } catch {
        return createInitialState();
      }
    }

    function saveState(state) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    }

    function exportState(state) {
      const payload = { app: 'CBSE 10 Tracker', exportedAt: new Date().toISOString(), state };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cbse10-tracker-${toLocalDateString()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function Ring({ value, size = 128, stroke = 10, accent = '#8b5cf6', label }) {
      const radius = (size - stroke) / 2;
      const circumference = 2 * Math.PI * radius;
      const dash = (Math.min(100, Math.max(0, value)) / 100) * circumference;
      return (
        <div className="relative inline-flex items-center justify-center">
          <svg width={size} height={size} className="-rotate-90">
            <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth={stroke} />
            <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke={accent} strokeWidth={stroke}
              strokeLinecap="round" strokeDasharray={`${dash} ${circumference}`} className="transition-all duration-700" />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            <span className="text-2xl font-bold tracking-tight text-white">{Math.round(value)}%</span>

            'group flex items-center gap-2 rounded-xl border px-3 py-2 text-left text-xs transition-all duration-200',
            checked
              ? 'border-violet-500/35 bg-violet-500/10 text-violet-200 shadow-[0_0_20px_-8px_rgba(139,92,246,.5)]'
              : 'border-white/10 bg-white/[0.025] text-zinc-400 hover:border-white/20 hover:bg-white/[0.05]'
          )}>
          <span className={cn(
            'flex h-4 w-4 shrink-0 items-center justify-center rounded-[5px] border transition-all',
            checked ? 'border-violet-400 bg-violet-500 text-white' : 'border-white/20 bg-transparent'
          )}>
            {checked && <Icon name="check" size={12} />}
          </span>
          <span className="leading-tight">{meta.short}</span>
        </button>
      );
    }

    function Modal({ open, onClose, title, children, wide = false }) {
      if (!open) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-end justify-center p-0 sm:items-center sm:p-6">
          <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} />
          <div className={cn(
            'relative max-h-[92vh] w-full overflow-y-auto rounded-t-3xl border border-white/10 bg-ink-850 shadow-2xl sm:rounded-3xl',
            wide ? 'sm:max-w-3xl' : 'sm:max-w-lg'
          )}>
            <div className="sticky top-0 z-10 flex items-center justify-between border-b border-white/10 bg-ink-850/95 px-5 py-4 backdrop-blur">
              <h2 className="text-sm font-semibold tracking-tight text-white">{title}</h2>
              <button onClick={onClose} className="rounded-lg p-1.5 text-zinc-400 transition hover:bg-white/10 hover:text-white" aria-label="Close">
                <Icon name="x" size={18} />
              </button>
            </div>
            <div className="p-5">{children}</div>
          </div>
        </div>
      );
    }

    function EmptyState({ icon, title, description }) {
      return (
        <div className="flex flex-col items-center justify-center rounded-2xl border border-dashed border-white/10 bg-white/[0.02] px-6 py-16 text-center">
          <div className="mb-4 flex h-12 w-12 items-center justify-center rounded-2xl bg-violet-500/10 text-violet-300">
            <Icon name={icon} size={22} />
          </div>
          <h3 className="text-sm font-semibold text-white">{title}</h3>
          <p className="mt-1 max-w-sm text-xs leading-relaxed text-zinc-500">{description}</p>
        </div>
      );
    }

    function Field({ label, children, hint }) {
      return (
        <label className="block">
          <span className="mb-1.5 block text-[11px] font-medium uppercase tracking-wider text-zinc-500">{label}</span>
          {children}
          {hint && <span className="mt-1 block text-[11px] text-zinc-600">{hint}</span>}
        </label>
      );
    }

    const inputClass = 'w-full rounded-xl border border-white/10 bg-black/20 px-3 py-2.5 text-sm text-zinc-200 outline-none transition placeholder:text-zinc-600 focus:border-violet-500/50 focus:ring-2 focus:ring-violet-500/20';

    /* ============================================================
       7. APP COMPONENTS
    ============================================================ */

    function Sidebar({ state, view, setView, collapsed, setCollapsed, mobileOpen, setMobileOpen }) {
      const chapters = state.chapters;
      const stats = overallStats(chapters);

      const nav = [
        { view: 'dashboard', label: 'Dashboard', icon: 'dashboard' },
        { view: 'chapters', label: 'All Chapters', icon: 'book' },
        { view: 'mission', label: 'Next Mission', icon: 'target' },
        { view: 'mistakes', label: 'Mistake Tracker', icon: 'alert' },
        { view: 'revisions', label: 'Revision Log', icon: 'sparkles' },
        { view: 'settings', label: 'Settings', icon: 'settings' },
      ];

      const content = (
        <div className="flex h-full flex-col">
          {/* Brand */}
          <div className={cn('flex items-center gap-3 border-b border-white/10 px-4 py-5', collapsed && 'justify-center px-2')}>
            <div className="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-violet-500/15 text-violet-300 shadow-glow">
              <Icon name="target" size={20} />
            </div>
            {!collapsed && (
              <div className="min-w-0">
                <p className="truncate text-sm font-semibold tracking-tight text-white">CBSE 10 Tracker</p>
                <p className="text-[10px] uppercase tracking-wider text-zinc-500">Syllabus · Revision · Exams</p>
              </div>
            )}
          </div>

          {/* Overall progress mini */}
          {!collapsed && (
            <div className="border-b border-white/10 px-4 py-4">
              <div className="mb-2 flex items-center justify-between text-[11px]">
                <span className="text-zinc-500">Overall progress</span>
                <span className="font-semibold text-violet-300">{Math.round(stats.percent)}%</span>
              </div>
              <ProgressBar value={stats.percent} height="h-1.5" />
              <p className="mt-2 text-[10px] text-zinc-600">{stats.complete} of {stats.total} chapters complete</p>
            </div>
          )}

          {/* Navigation */}
          <nav className="flex-1 space-y-1 overflow-y-auto px-2 py-3">
            {nav.map(item => (
              <button key={item.view} onClick={() => { setView(item.view); setMobileOpen(false); }}
                className={cn(
                  'flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-[13px] font-medium transition-all',
                  view === item.view
                    ? 'bg-violet-500/12 text-violet-200 shadow-[inset_0_0_0_1px_rgba(139,92,246,.22)]'
                    : 'text-zinc-400 hover:bg-white/[0.04] hover:text-zinc-200',
                  collapsed && 'justify-center px-2'
                )}>
                <Icon name={item.icon} size={17} />
                {!collapsed && <span>{item.label}</span>}
              </button>
            ))}

            <div className="my-2 border-t border-white/10" />

            {/* Subjects */}
            {!collapsed && <p className="px-3 pb-1 pt-2 text-[10px] font-semibold uppercase tracking-wider text-zinc-600">Subjects</p>}
            {SUBJECTS.map(subject => {
              const s = subjectStats(chapters, subject.id);
              return (
                <button key={subject.id}
                  onClick={() => { setView('chapters'); setMobileOpen(false); }}
                  className={cn('group flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left transition hover:bg-white/[0.04]', collapsed && 'justify-center px-2')}>
                  <div className="flex h-6 w-6 shrink-0 items-center justify-center rounded-lg" style={{ backgroundColor: subject.accent + '18', color: subject.accent }}>
                    <Icon name={subject.icon} size={13} />
                  </div>
                  {!collapsed && (
                    <div className="min-w-0 flex-1">
                      <div className="flex items-center justify-between gap-2">
                        <span className="truncate text-[12px] text-zinc-400 group-hover:text-zinc-200">{subject.short}</span>
                        <span className="text-[10px] font-medium text-zinc-600">{Math.round(s.percent)}%</span>
                      </div>
                      <ProgressBar value={s.percent} accent={subject.accent} height="h-1" className="mt-1" />
                    </div>
                  )}
                </button>
              );
            })}
          </nav>

          {/* Footer */}
          <div className="border-t border-white/10 p-3">
            <button onClick={() => setCollapsed(!collapsed)}
              className="hidden w-full items-center justify-center gap-2 rounded-xl border border-white/10 px-3 py-2 text-[11px] text-zinc-500 transition hover:bg-white/[0.04] lg:flex">
              <Icon name={collapsed ? 'chevronRight' : 'chevronLeft'} size={14} />
              {!collapsed && 'Collapse'}
            </button>
          </div>
        </div>
      );

      return (
        <>
          {/* Mobile overlay */}
          {mobileOpen && (
            <div className="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm lg:hidden" onClick={() => setMobileOpen(false)} />
          )}
          <aside className={cn(
            'fixed inset-y-0 left-0 z-50 border-r border-white/10 bg-ink-900 transition-all duration-300',
            collapsed ? 'w-20' : 'w-64',
            mobileOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'
          )}>
            {content}
          </aside>
        </>
      );
    }

    function Dashboard({ state, chapters, setView, setSubjectFilter }) {
      const stats = overallStats(chapters);
      const recent = [...chapters]
        .sort((a, b) => new Date(b.lastUpdated).getTime() - new Date(a.lastUpdated).getTime())
        .slice(0, 6);

      const statCards = [
        { label: 'Exam-ready chapters', value: stats.examReady, icon: 'checkCircle', tone: 'violet', hint: 'Confident for exam-level questions' },
        { label: 'Copy work pending', value: stats.copyPending, icon: 'clipboard', tone: 'amber', hint: 'Notebook / notes incomplete' },
        { label: 'Studied but not revised', value: stats.studiedOnly, icon: 'clock', tone: 'rose', hint: 'Needs a revision pass' },
        { label: 'Chapters remaining', value: stats.remaining, icon: 'circle', tone: 'cyan', hint: 'Not marked complete yet' },
      ];

      return (
        <div className="space-y-6 animate-in">
          {/* Header */}
          <div className="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
            <div>
              <p className="text-[11px] uppercase tracking-[0.2em] text-violet-400/80">Overview</p>
              <h1 className="mt-1 text-2xl font-bold tracking-tight text-white sm:text-3xl">Your preparation at a glance</h1>
              <p className="mt-1 text-sm text-zinc-500">Progress is calculated from the five independent statuses of every chapter.</p>
            </div>
            <div className="flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3 py-2">
              <Icon name="flame" size={16} className="text-orange-400" />
              <div>
                <p className="text-[10px] uppercase tracking-wider text-zinc-600">Study streak</p>
                <p className="text-sm font-semibold text-white">{state.streak.current} day{state.streak.current === 1 ? '' : 's'}</p>
              </div>
            </div>
          </div>

          {/* Top row */}
          <div className="grid gap-4 lg:grid-cols-3">
            {/* Ring card */}
            <div className="rounded-2xl border border-white/10 bg-gradient-to-br from-ink-850 to-ink-900 p-5 shadow-glow lg:col-span-1">
              <div className="flex items-center justify-between">
                <div>
                  <p className="text-[11px] uppercase tracking-wider text-zinc-500">Syllabus completion</p>
                  <p className="mt-1 text-sm text-zinc-400">{stats.total} chapters across 7 subjects</p>
                </div>
                <Icon name="trending" size={18} className="text-violet-400" />
              </div>
              <div className="mt-4 flex items-center justify-center">
                <Ring value={stats.percent} size={152} stroke={12} label="all statuses" />
              </div>
              <div className="mt-4 grid grid-cols-2 gap-2 text-center">
                <div className="rounded-xl bg-white/[0.03] p-2">
                  <p className="text-lg font-bold text-white">{stats.studied}</p>
                  <p className="text-[10px] text-zinc-600">Studied once</p>
                </div>
                <div className="rounded-xl bg-white/[0.03] p-2">
                  <p className="text-lg font-bold text-white">{stats.revised}</p>
                  <p className="text-[10px] text-zinc-600">Revised</p>
                </div>
              </div>
            </div>

            {/* Stat cards */}
            <div className="grid grid-cols-2 gap-3 lg:col-span-2">
              {statCards.map(card => (
                <div key={card.label} className="rounded-2xl border border-white/10 bg-ink-850 p-4 transition hover:border-white/20">
                  <div className="flex items-center justify-between">
                    <div className={cn('flex h-8 w-8 items-center justify-center rounded-xl',
                      card.tone === 'violet' && 'bg-violet-500/10 text-violet-300',
                      card.tone === 'amber' && 'bg-amber-500/10 text-amber-300',
                      card.tone === 'rose' && 'bg-rose-500/10 text-rose-300',
                      card.tone === 'cyan' && 'bg-cyan-500/10 text-cyan-300')}>
                      <Icon name={card.icon} size={16} />
                    </div>
                    <span className="text-2xl font-bold tracking-tight text-white">{card.value}</span>
                  </div>
                  <p className="mt-3 text-[12px] font-medium text-zinc-300">{card.label}</p>
                  <p className="mt-0.5 text-[10px] leading-relaxed text-zinc-600">{card.hint}</p>
                </div>
              ))}
            </div>
          </div>

          {/* Subject progress */}
          <div className="rounded-2xl border border-white/10 bg-ink-850 p-5">
            <div className="mb-4 flex items-center justify-between">
              <div>
                <h2 className="text-sm font-semibold text-white">Subject-wise completion</h2>
                <p className="text-[11px] text-zinc-500">Based on all five statuses per chapter.</p>
              </div>
              <button onClick={() => setView('chapters')} className="text-[11px] font-medium text-violet-300 hover:text-violet-200">View all →</button>
            </div>
            <div className="space-y-3">
              {SUBJECTS.map(subject => {
                const s = subjectStats(chapters, subject.id);
                return (
                  <button key={subject.id}
                    onClick={() => { setSubjectFilter(subject.id); setView('chapters'); }}
                    className="group flex w-full items-center gap-3 rounded-xl border border-transparent px-2 py-2 text-left transition hover:border-white/10 hover:bg-white/[0.02]">
                    <div className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg" style={{ backgroundColor: subject.accent + '18', color: subject.accent }}>
                      <Icon name={subject.icon} size={15} />
                    </div>
                    <div className="min-w-0 flex-1">
                      <div className="flex items-center justify-between gap-2">
                        <span className="truncate text-[12px] font-medium text-zinc-300 group-hover:text-white">{subject.name}</span>
                        <span className="text-[11px] font-semibold text-zinc-400">{Math.round(s.percent)}%</span>
                      </div>
                      <ProgressBar value={s.percent} accent={subject.accent} height="h-1.5" className="mt-1.5" />
                      <div className="mt-1 flex gap-3 text-[10px] text-zinc-600">
                        <span>{s.complete}/{s.total} complete</span>
                        <span>{s.examReady} exam-ready</span>
                        <span>{s.copyPending} copy pending</span>
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Recently updated */}
          <div className="rounded-2xl border border-white/10 bg-ink-850 p-5">
            <div className="mb-3 flex items-center justify-between">
              <h2 className="text-sm font-semibold text-white">Recently updated</h2>
              <button onClick={() => setView('chapters')} className="text-[11px] font-medium text-violet-300 hover:text-violet-200">Open tracker →</button>
            </div>
            {recent.length === 0 ? (
              <p className="text-xs text-zinc-500">No chapters yet.</p>
            ) : (
              <div className="divide-y divide-white/5">
                {recent.map(ch => {
                  const subject = SUBJECT_MAP[ch.subjectId];
                  return (
                    <div key={ch.id} className="flex items-center gap-3 py-2.5">
                      <div className="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg" style={{ backgroundColor: subject.accent + '18', color: subject.accent }}>
                        <Icon name={subject.icon} size={13} />
                      </div>
                      <div className="min-w-0 flex-1">
                        <p className="truncate text-[12px] font-medium text-zinc-200">{ch.name}</p>
                        <p className="text-[10px] text-zinc-600">{subject.short} · updated {formatDateTime(ch.lastUpdated)}</p>
                      </div>
                      <span className="shrink-0 text-[10px] font-semibold text-violet-300">{Math.round(chapterPercent(ch))}%</span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    function ChapterCard({ chapter, subject, onToggleStatus, onEdit, onDelete, onMoveUp, onMoveDown, isFirst, isLast }) {
      const [expanded, setExpanded] = useState(false);
      const pct = chapterPercent(chapter);

      return (
        <div className="rounded-2xl border border-white/10 bg-ink-850 transition hover:border-white/15">
          <div className="p-4">
            <div className="flex items-start gap-3">
              <div className="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl" style={{ backgroundColor: subject.accent + '18', color: subject.accent }}>
                <Icon name={subject.icon} size={17} />
              </div>
              <div className="min-w-0 flex-1">
                <div className="flex flex-wrap items-center gap-2">
                  <h3 className="text-[13px] font-semibold leading-snug text-white">{chapter.name}</h3>
                  {chapter.weightage === 3 && <Badge tone="rose">High weightage</Badge>}
                  {chapter.status.complete && <Badge tone="green">Complete</Badge>}
                </div>
                <p className="mt-0.5 text-[11px] text-zinc-500">{subject.short} · {chapter.group}</p>
              </div>
              <div className="flex shrink-0 items-center gap-1">
                <button onClick={onMoveUp} disabled={isFirst} title="Move up"
                  className="rounded-lg p-1.5 text-zinc-600 transition hover:bg-white/5 hover:text-zinc-300 disabled:opacity-20">
                  <Icon name="arrowUp" size={14} />
                </button>
                <button onClick={onMoveDown} disabled={isLast} title="Move down"
                  className="rounded-lg p-1.5 text-zinc-600 transition hover:bg-white/5 hover:text-zinc-300 disabled:opacity-20">
                  <Icon name="arrowDown" size={14} />
                </button>
                <button onClick={onEdit} title="Edit chapter"
                  className="rounded-lg p-1.5 text-zinc-500 transition hover:bg-white/5 hover:text-violet-300">
                  <Icon name="edit" size={14} />
                </button>
                <button onClick={onDelete} title="Delete chapter"
                  className="rounded-lg p-1.5 text-zinc-600 transition hover:bg-rose-500/10 hover:text-rose-300">
                  <Icon name="trash" size={14} />
                </button>
              </div>
            </div>

            {/* Five statuses */}
            <div className="mt-3 flex flex-wrap gap-1.5">
              {STATUS_META.map(meta => (
                <StatusCheck key={meta.key} statusKey={meta.key} checked={chapter.status[meta.key]}
                  onToggle={() => onToggleStatus(chapter.id, meta.key)} />
              ))}
            </div>

            <div className="mt-3 flex items-center gap-3">
              <ProgressBar value={pct} height="h-1.5" />
              <span className="shrink-0 text-[10px] font-semibold text-zinc-500">{Math.round(pct)}%</span>
            </div>

            {/* Quick info */}
            <div className="mt-2 flex flex-wrap items-center gap-x-4 gap-y-1 text-[10px] text-zinc-600">
              {chapter.testScore !== null && <span>Test: {chapter.testScore}%</span>}
              {chapter.nextAction && <span className="line-clamp-1">Next: {chapter.nextAction}</span>}
              {chapter.mistakes && !chapter.mistakesResolved && <span className="text-rose-400">Weak areas logged</span>}
            </div>

            <button onClick={() => setExpanded(!expanded)} className="mt-2 text-[11px] font-medium text-violet-300 hover:text-violet-200">
              {expanded ? 'Hide details' : 'Show details'}
            </button>
          </div>

          {expanded && (
            <div className="border-t border-white/5 px-4 py-3 text-[11px] text-zinc-500">
              <div className="grid gap-3 sm:grid-cols-2">
                <div>
                  <p className="mb-1 text-[10px] uppercase tracking-wider text-zinc-600">Important topics</p>
                  {chapter.topics.length ? (
                    <ul className="list-inside list-disc space-y-0.5">
                      {chapter.topics.map((t, i) => <li key={i}>{t}</li>)}
                    </ul>
                  ) : <p className="italic text-zinc-600">No topics added.</p>}
                </div>
                <div className="space-y-2">
                  {chapter.notes && (
                    <div>
                      <p className="mb-0.5 text-[10px] uppercase tracking-wider text-zinc-600">Notes</p>
                      <p className="whitespace-pre-wrap text-zinc-400">{chapter.notes}</p>
                    </div>
                  )}
                  {chapter.mistakes && (
                    <div>
                      <p className="mb-0.5 text-[10px] uppercase tracking-wider text-zinc-600">Mistakes / weak areas</p>
                      <p className="whitespace-pre-wrap text-rose-300/80">{chapter.mistakes}</p>
                    </div>
                  )}
                  {chapter.revisionHistory.length > 0 && (
                    <div>
                      <p className="mb-0.5 text-[10px] uppercase tracking-wider text-zinc-600">Recent revision</p>
                      <p>{formatDate(chapter.revisionHistory[chapter.revisionHistory.length - 1].date)} — {chapter.revisionHistory[chapter.revisionHistory.length - 1].note}</p>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ChaptersView({ state, chapters, subjectFilter, setSubjectFilter, statusFilter, setStatusFilter, groupFilter, setGroupFilter, searchQuery, setSearchQuery, onToggleStatus, onEdit, onDelete, onMove, onNew }) {
      const groups = getGroups(chapters, subjectFilter === 'all' ? null : subjectFilter);

      const filtered = chapters
        .filter(ch => {
          if (subjectFilter !== 'all' && ch.subjectId !== subjectFilter) return false;
          if (statusFilter !== 'all') {
            if (statusFilter === 'pendingCopy') return !ch.status.copy;
            if (statusFilter === 'studiedOnly') return ch.status.studied && !ch.status.revised;
            if (statusFilter === 'examReady') return ch.status.examReady;
            if (statusFilter === 'complete') return ch.status.complete;
            if (statusFilter === 'notComplete') return !ch.status.complete;
            return true;
          }
          if (groupFilter !== 'all' && ch.group !== groupFilter) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return ch.name.toLowerCase().includes(q) || ch.topics.some(t => t.toLowerCase().includes(q));
          }
          return true;
        })
        .sort((a, b) => a.order - b.order);

      return (
        <div className="space-y-5 animate-in">
          <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div>
              <p className="text-[11px] uppercase tracking-[0.2em] text-violet-400/80">Tracker</p>
              <h1 className="mt-1 text-2xl font-bold tracking-tight text-white">All chapters</h1>
              <p className="text-sm text-zinc-500">{filtered.length} chapter{filtered.length === 1 ? '' : 's'} shown</p>
            </div>
            <button onClick={onNew} className="inline-flex items-center justify-center gap-2 rounded-xl bg-violet-500 px-4 py-2.5 text-sm font-semibold text-white shadow-glow transition hover:bg-violet-400">
              <Icon name="plus" size={16} /> Add chapter
            </button>
          </div>

          {/* Filters */}
          <div className="rounded-2xl border border-white/10 bg-ink-850 p-3">
            <div className="flex flex-col gap-2 sm:flex-row sm:items-center">
              <div className="relative flex-1">
                <Icon name="search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-600" />
                <input value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                  placeholder="Search chapters or topics…" className={cn(inputClass, 'pl-9')} />
              </div>
              <div className="flex flex-wrap gap-2">
                <select value={subjectFilter} onChange={e => { setSubjectFilter(e.target.value); setGroupFilter('all'); }} className={cn(inputClass, 'w-auto min-w-[130px]')}>
                  <option value="all">All subjects</option>
                  {SUBJECTS.map(s => <option key={s.id} value={s.id}>{s.short}</option>)}
                </select>
                <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className={cn(inputClass, 'w-auto min-w-[150px]')}>
                  <option value="all">All statuses</option>
                  <option value="notComplete">Not complete</option>
                  <option value="examReady">Exam ready</option>
                  <option value="pendingCopy">Copy pending</option>
                  <option value="studiedOnly">Studied, not revised</option>
                  <option value="complete">Complete</option>
                </select>
                <select value={groupFilter} onChange={e => setGroupFilter(e.target.value)} className={cn(inputClass, 'w-auto min-w-[130px]')}>
                  <option value="all">All groups</option>
                  {groups.map(g => <option key={g} value={g}>{g}</option>)}
                </select>
              </div>
            </div>
          </div>

          {/* List */}
          {filtered.length === 0 ? (
            <EmptyState icon="book" title="No chapters match these filters" description="Try clearing the search or choosing a different subject/status." />
          ) : (
            <div className="space-y-3">
              {filtered.map((ch, index) => (
                <ChapterCard key={ch.id} chapter={ch} subject={SUBJECT_MAP[ch.subjectId]}
                  onToggleStatus={onToggleStatus} onEdit={() => onEdit(ch)} onDelete={() => onDelete(ch)}
                  onMoveUp={() => onMove(ch.id, -1)} onMoveDown={() => onMove(ch.id, 1)}
                  isFirst={index === 0} isLast={index === filtered.length - 1} />
              ))}
            </div>
          )}
        </div>
      );
    }

    function ChapterModal({ chapter, onClose, onSave }) {
      const isNew = !chapter.id;
      const [form, setForm] = useState(() => chapter);
      const [newTopic, setNewTopic] = useState('');
      const [revDate, setRevDate] = useState(toLocalDateString());
      const [revNote, setRevNote] = useState('');

      const set = (key, value) => setForm(prev => ({ ...prev, [key]: value }));
      const setStatus = (key) => setForm(prev => ({
        ...prev,
        status: { ...prev.status, [key]: !prev.status[key] },
      }));

      const addTopic = () => {
        if (!newTopic.trim()) return;
        setForm(prev => ({ ...prev, topics: [...prev.topics, newTopic.trim()] }));
        setNewTopic('');
      };
      const removeTopic = (index) => setForm(prev => ({ ...prev, topics: prev.topics.filter((_, i) => i !== index) }));

      const addRevision = () => {
        if (!revDate) return;
        setForm(prev => ({
          ...prev,
          revisionHistory: [...prev.revisionHistory, { id: uid(), date: revDate, note: revNote.trim() || 'Revision' }],
        }));
        setRevNote('');
      };

      const handleSave = () => {
        if (!form.name.trim()) return alert('Please enter a chapter name.');
        onSave({
          ...form,
          name: form.name.trim(),
          topics: form.topics.filter(t => t.trim()),
          lastUpdated: new Date().toISOString(),
        });
      };

      return (
        <Modal open onClose={onClose} title={isNew ? 'Add chapter' : 'Edit chapter'} wide>
          <div className="space-y-4">
            <div className="grid gap-3 sm:grid-cols-2">
              <Field label="Chapter name">
                <input value={form.name} onChange={e => set('name', e.target.value)} className={inputClass} placeholder="e.g. Real Numbers" />
              </Field>
              <Field label="Subject">
                <select value={form.subjectId} onChange={e => set('subjectId', e.target.value)} className={inputClass} disabled={!isNew}>
                  {SUBJECTS.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              </Field>
              <Field label="Group / Unit">
                <input value={form.group || ''} onChange={e => set('group', e.target.value)} className={inputClass} placeholder="e.g. Algebra" />
              </Field>
              <Field label="Weightage">
                <select value={form.weightage} onChange={e => set('weightage', Number(e.target.value))} className={inputClass}>
                  <option value={1}>Low</option>
                  <option value={2}>Medium</option>
                  <option value={3}>High</option>
                </select>
              </Field>
            </div>

            {/* Statuses */}
            <div>
              <p className="mb-2 text-[11px] font-medium uppercase tracking-wider text-zinc-500">Status indicators (independent)</p>
              <div className="flex flex-wrap gap-2">
                {STATUS_META.map(meta => (
                  <StatusCheck key={meta.key} statusKey={meta.key} checked={form.status[meta.key]} onToggle={() => setStatus(meta.key)} />
                ))}
              </div>
            </div>

            {/* Topics */}
            <Field label="Important topics / subtopics">
              <div className="space-y-2">
                {form.topics.map((topic, i) => (
                  <div key={i} className="flex items-center gap-2">
                    <input value={topic} onChange={e => {
                      const copy = [...form.topics];
                      copy[i] = e.target.value;
                      set('topics', copy);
                    }} className={inputClass} />
                    <button onClick={() => removeTopic(i)} className="rounded-lg p-2 text-zinc-600 hover:bg-rose-500/10 hover:text-rose-300">
                      <Icon name="trash" size={14} />
                    </button>
                  </div>
                ))}
                <div className="flex gap-2">
                  <input value={newTopic} onChange={e => setNewTopic(e.target.value)} onKeyDown={e => e.key === 'Enter' && (e.preventDefault(), addTopic())}
                    placeholder="Add a topic…" className={inputClass} />
                  <button onClick={addTopic} className="shrink-0 rounded-xl border border-white/10 px-3 text-sm text-violet-300 hover:bg-white/5">
                    <Icon name="plus" size={16} />
                  </button>
                </div>
              </div>
            </Field>

            <div className="grid gap-3 sm:grid-cols-2">
              <Field label="Test score (%)">
                <input type="number" min="0" max="100" value={form.testScore ?? ''} onChange={e => set('testScore', e.target.value === '' ? null : Number(e.target.value))} className={inputClass} placeholder="e.g. 78" />
              </Field>
              <Field label="Test date">
                <input type="date" value={form.testDate || ''} onChange={e => set('testDate', e.target.value || null)} className={inputClass} />
              </Field>
            </div>

            <Field label="Personal notes">
              <textarea rows={3} value={form.notes} onChange={e => set('notes', e.target.value)} className={inputClass} placeholder="Key formulas, summaries, doubts…" />
            </Field>

            <Field label="Mistakes / weak areas">
              <textarea rows={2} value={form.mistakes} onChange={e => set('mistakes', e.target.value)} className={inputClass} placeholder="Errors to avoid, concepts to revisit…" />
            </Field>
            <label className="flex items-center gap-2 text-xs text-zinc-400">
              <input type="checkbox" checked={form.mistakesResolved} onChange={e => set('mistakesResolved', e.target.checked)}
                className="h-4 w-4 rounded border-white/20 bg-black/20 accent-violet-500" />
              Mistakes resolved
            </label>

            <Field label="Next action required">
              <input value={form.nextAction} onChange={e => set('nextAction', e.target.value)} className={inputClass} placeholder="e.g. Solve NCERT exemplar Q1–Q10" />
            </Field>

            {/* Revision history */}
            <div>
              <p className="mb-2 text-[11px] font-medium uppercase tracking-wider text-zinc-500">Revision history</p>
              {form.revisionHistory.length === 0 && <p className="text-xs text-zinc-600">No revisions logged yet.</p>}
              <div className="space-y-1.5">
                {form.revisionHistory.map(entry => (
                  <div key={entry.id} className="flex items-center justify-between rounded-xl border border-white/5 bg-white/[0.02] px-3 py-2 text-xs">
                    <div>
                      <span className="font-medium text-zinc-300">{formatDate(entry.date)}</span>
                      <span className="ml-2 text-zinc-500">{entry.note}</span>
                    </div>
                    <button onClick={() => set('revisionHistory', form.revisionHistory.filter(e => e.id !== entry.id))}
                      className="text-zinc-600 hover:text-rose-300"><Icon name="x" size={13} /></button>
                  </div>
                ))}
              </div>
              <div className="mt-2 flex flex-col gap-2 sm:flex-row">
                <input type="date" value={revDate} onChange={e => setRevDate(e.target.value)} className={cn(inputClass, 'sm:w-40')} />
                <input value={revNote} onChange={e => setRevNote(e.target.value)} placeholder="What did you revise?" className={inputClass} />
                <button onClick={addRevision} className="shrink-0 rounded-xl bg-violet-500/15 px-3 py-2 text-xs font-medium text-violet-300 hover:bg-violet-500/25">Add</button>
              </div>
            </div>

            {/* Actions */}
            <div className="flex items-center justify-end gap-2 border-t border-white/10 pt-4">
              <button onClick={onClose} className="rounded-xl border border-white/10 px-4 py-2 text-sm text-zinc-400 hover:bg-white/5">Cancel</button>
              <button onClick={handleSave} className="rounded-xl bg-violet-500 px-4 py-2 text-sm font-semibold text-white shadow-glow hover:bg-violet-400">
                {isNew ? 'Add chapter' : 'Save changes'}
              </button>
            </div>
          </div>
        </Modal>
      );
    }

    function NextMission({ state, chapters, setState }) {
      const rec = useMemo(() => getMissionRecommendation(state, chapters), [state, chapters]);
      const [manualId, setManualId] = useState('');
      const [note, setNote] = useState('');
      const [score, setScore] = useState('');
      const [date, setDate] = useState(toLocalDateString());

      const setManual = () => {
        if (!manualId) return;
        setState(prev => ({ ...prev, mission: { chapterId: manualId, createdAt: new Date().toISOString(), note } }));
      };
      const clearMission = () => setState(prev => ({ ...prev, mission: null }));

      return (
        <div className="space-y-5 animate-in">
          <div>
            <p className="text-[11px] uppercase tracking-[0.2em] text-violet-400/80">Focus</p>
            <h1 className="mt-1 text-2xl font-bold tracking-tight text-white">Next Mission</h1>
            <p className="text-sm text-zinc-500">The tracker prioritises chapters studied once but not revised, pending exam preparation, and high-weightage chapters.</p>
          </div>

          {rec ? (
            <div className="rounded-2xl border border-violet-500/25 bg-gradient-to-br from-violet-500/10 to-ink-850 p-5 shadow-glow">
              <div className="flex items-start gap-3">
                <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-violet-500/20 text-violet-300">
                  <Icon name="target" size={20} />
                </div>
                <div className="min-w-0 flex-1">
                  <div className="flex flex-wrap items-center gap-2">
                    <h2 className="text-lg font-semibold text-white">{rec.chapter.name}</h2>
                    {rec.manual && <Badge tone="violet">Manual</Badge>}
                    {rec.chapter.weightage === 3 && <Badge tone="rose">High weightage</Badge>}
                  </div>
                  <p className="text-xs text-zinc-400">{SUBJECT_MAP[rec.chapter.subjectId].name} · {rec.chapter.group}</p>
                  <div className="mt-2 flex flex-wrap gap-1.5">
                    {rec.reasons.map((r, i) => <Badge key={i} tone="amber">{r}</Badge>)}
                  </div>
                  <div className="mt-3 flex flex-wrap gap-3 text-[11px] text-zinc-500">
                    <span>Studied: {rec.chapter.status.studied ? 'Yes' : 'No'}</span>
                    <span>Revised: {rec.chapter.status.revised ? 'Yes' : 'No'}</span>
                    <span>Exam ready: {rec.chapter.status.examReady ? 'Yes' : 'No'}</span>
                    <span>Copy: {rec.chapter.status.copy ? 'Complete' : 'Pending'}</span>
                  </div>
                  {rec.manual && state.mission?.note && <p className="mt-2 text-xs text-violet-200/80">Note: {state.mission.note}</p>}
                </div>
              </div>
              <div className="mt-4 flex flex-wrap gap-2">
                <button onClick={clearMission} className="rounded-xl border border-white/15 px-3 py-2 text-xs text-zinc-400 hover:bg-white/5">Clear mission</button>
              </div>
            </div>
          ) : (
            <EmptyState icon="target" title="All chapters are complete" description="Every chapter is marked complete. You can still revise or add new chapters." />
          )}

          {/* Manual mission */}
          <div className="rounded-2xl border border-white/10 bg-ink-850 p-5">
            <h3 className="text-sm font-semibold text-white">Or choose your own mission</h3>
            <div className="mt-3 grid gap-3 sm:grid-cols-2">
              <Field label="Chapter">
                <select value={manualId} onChange={e => setManualId(e.target.value)} className={inputClass}>
                  <option value="">Select a chapter…</option>
                  {chapters.filter(c => !c.status.complete).sort((a, b) => a.subjectId.localeCompare(b.subjectId) || a.order - b.order).map(ch => (
                    <option key={ch.id} value={ch.id}>{SUBJECT_MAP[ch.subjectId].short} — {ch.name}</option>
                  ))}
                </select>
              </Field>
              <Field label="Note (optional)">
                <input value={note} onChange={e => setNote(e.target.value)} className={inputClass} placeholder="Why this chapter?" />
              </Field>
            </div>
            <button onClick={setManual} disabled={!manualId}
              className="mt-3 rounded-xl bg-violet-500 px-4 py-2 text-sm font-semibold text-white shadow-glow transition hover:bg-violet-400 disabled:opacity-40">
              Set mission
            </button>
          </div>

          {/* Quick log */}
          <div className="rounded-2xl border border-white/10 bg-ink-850 p-5">
            <h3 className="text-sm font-semibold text-white">Log a study session</h3>
            <p className="text-[11px] text-zinc-500">Toggle any status on a chapter to automatically update your streak.</p>
            <div className="mt-3 grid gap-3 sm:grid-cols-3">
              <Field label="Chapter">
                <select value={manualId} onChange={e => setManualId(e.target.value)} className={inputClass}>
                  <option value="">Select chapter…</option>
                  {chapters.map(ch => <option key={ch.id} value={ch.id}>{SUBJECT_MAP[ch.subjectId].short} — {ch.name}</option>)}
                </select>
              </Field>
              <Field label="Date">
                <input type="date" value={date} onChange={e => setDate(e.target.value)} className={inputClass} />
              </Field>
              <Field label="Score / confidence (optional)">
                <input value={score} onChange={e => setScore(e.target.value)} className={inputClass} placeholder="e.g. 72% or 8/10" />
              </Field>
            </div>
          </div>
        </div>
      );
    }

    function MistakeTracker({ chapters, onToggleResolved, onEdit }) {
      const list = chapters.filter(ch => ch.mistakes && ch.mistakes.trim());
      return (
        <div className="space-y-5 animate-in">
          <div>
            <p className="text-[11px] uppercase tracking-[0.2em] text-violet-400/80">Improve</p>
            <h1 className="mt-1 text-2xl font-bold tracking-tight text-white">Mistake Tracker</h1>
            <p className="text-sm text-zinc-500">Weak areas and errors logged across chapters.</p>
          </div>

          {list.length === 0 ? (
            <EmptyState icon="alert" title="No mistakes logged yet" description="When you add mistakes or weak areas to a chapter, they appear here." />
          ) : (
            <div className="space-y-3">
              {list.map(ch => {
                const subject = SUBJECT_MAP[ch.subjectId];
                return (
                  <div key={ch.id} className={cn('rounded-2xl border p-4 transition', ch.mistakesResolved ? 'border-emerald-500/20 bg-emerald-500/[0.04]' : 'border-rose-500/20 bg-rose-500/[0.04]')}>
                    <div className="flex items-start gap-3">
                      <div className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg" style={{ backgroundColor: subject.accent + '18', color: subject.accent }}>
                        <Icon name={subject.icon} size={14} />
                      </div>
                      <div className="min-w-0 flex-1">
                        <div className="flex flex-wrap items-center gap-2">
                          <h3 className="text-[13px] font-semibold text-white">{ch.name}</h3>
                          <Badge tone={ch.mistakesResolved ? 'green' : 'rose'}>{ch.mistakesResolved ? 'Resolved' : 'Open'}</Badge>
                        </div>
                        <p className="mt-1 whitespace-pre-wrap text-xs text-zinc-400">{ch.mistakes}</p>
                        <div className="mt-2 flex gap-2">
                          <button onClick={() => onToggleResolved(ch.id)} className="text-[11px] font-medium text-violet-300 hover:text-violet-200">
                            {ch.mistakesResolved ? 'Mark as open' : 'Mark resolved'}
                          </button>
                          <button onClick={() => onEdit(ch)} className="text-[11px] font-medium text-zinc-500 hover:text-zinc-300">Edit</button>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function RevisionLog({ chapters }) {
      const entries = useMemo(() => {
        return chapters
          .flatMap(ch => ch.revisionHistory.map(e => ({ ...e, chapterName: ch.name, subjectId: ch.subjectId, chapterId: ch.id })))
          .sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());
      }, [chapters]);

      return (
        <div className="space-y-5 animate-in">
          <div>
            <p className="text-[11px] uppercase tracking-[0.2em] text-violet-400/80">History</p>
            <h1 className="mt-1 text-2xl font-bold tracking-tight text-white">Revision Log</h1>
            <p className="text-sm text-zinc-500">Every revision entry you add from a chapter appears here.</p>
          </div>

          {entries.length === 0 ? (
            <EmptyState icon="sparkles" title="No revisions logged" description="Open a chapter, add a revision entry, and it will show up here." />
          ) : (
            <div className="rounded-2xl border border-white/10 bg-ink-850 p-2">
              <div className="divide-y divide-white/5">
                {entries.map(entry => {
                  const subject = SUBJECT_MAP[entry.subjectId];
                  return (
                    <div key={entry.id} className="flex items-center gap-3 px-3 py-3">
                      <div className="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg" style={{ backgroundColor: subject.accent + '18', color: subject.accent }}>
                        <Icon name={subject.icon} size={13} />
                      </div>
                      <div className="min-w-0 flex-1">
                        <p className="truncate text-[12px] font-medium text-zinc-200">{entry.chapterName}</p>
                        <p className="text-[10px] text-zinc-600">{subject.short} · {formatDate(entry.date)}</p>
                      </div>
                      <span className="shrink-0 text-[11px] text-zinc-500">{entry.note}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    function Settings({ state, setState, chapters, onReset }) {
      const [importError, setImportError] = useState('');
      const fileRef = useRef(null);
      const [confirmReset, setConfirmReset] = useState(false);

      const handleImport = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
          try {
            const parsed = JSON.parse(e.target.result);
            const normalized = normalizeState(parsed);
            setState(normalized);
            setImportError('');
            alert('Progress imported successfully.');
          } catch {
            setImportError('Could not read this file. Please choose a valid JSON export from this tracker.');
          }
        };
        reader.readAsText(file);
      };

      const streakDates = state.streak.studyDates || [];
      const last30 = lastNDates(30);

      return (
        <div className="space-y-5 animate-in">
          <div>
            <p className="text-[11px] uppercase tracking-[0.2em] text-violet-400/80">Settings</p>
            <h1 className="mt-1 text-2xl font-bold tracking-tight text-white">Data & preferences</h1>
            <p className="text-sm text-zinc-500">Everything is stored locally in your browser.</p>
          </div>

          {/* Streak */}
          <div className="rounded-2xl border border-white/10 bg-ink-850 p-5">
            <div className="flex items-center gap-3">
              <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-orange-500/10 text-orange-300">
                <Icon name="flame" size={20} />
              </div>
              <div>
                <p className="text-sm font-semibold text-white">Study streak</p>
                <p className="text-xs text-zinc-500">Automatically updated when you toggle a status.</p>
              </div>
            </div>
            <div className="mt-4 grid grid-cols-3 gap-2 text-center">
              <div className="rounded-xl bg-white/[0.03] p-3">
                <p className="text-xl font-bold text-white">{state.streak.current}</p>
                <p className="text-[10px] text-zinc-600">Current</p>
              </div>
              <div className="rounded-xl bg-white/[0.03] p-3">
                <p className="text-xl font-bold text-white">{state.streak.longest}</p>
                <p className="text-[10px] text-zinc-600">Longest</p>
              </div>
              <div className="rounded-xl bg-white/[0.03] p-3">
                <p className="text-sm font-semibold text-white">{state.streak.lastStudyDate ? formatDate(state.streak.lastStudyDate) : '—'}</p>
                <p className="text-[10px] text-zinc-600">Last study</p>
              </div>
            </div>
            <div className="mt-4">
              <p className="mb-2 text-[10px] uppercase tracking-wider text-zinc-600">Last 30 days</p>
              <div className="flex flex-wrap gap-1">
                {last30.map(date => {
                  const active = streakDates.includes(date);
                  return <div key={date} title={date} className={cn('h-4 w-4 rounded-[4px]', active ? 'bg-violet-500' : 'bg-white/[0.06]')} />;
                })}
              </div>
            </div>
          </div>

          {/* Export / Import */}
          <div className="grid gap-4 sm:grid-cols-2">
            <div className="rounded-2xl border border-white/10 bg-ink-850 p-5">
              <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-violet-500/10 text-violet-300">
                <Icon name="download" size={18} />
              </div>
              <h3 className="mt-3 text-sm font-semibold text-white">Export progress</h3>
              <p className="mt-1 text-xs text-zinc-500">Download all chapters, statuses, notes and streaks as a JSON file.</p>
              <button onClick={() => exportState(state)}
                className="mt-3 w-full rounded-xl bg-violet-500 px-4 py-2.5 text-sm font-semibold text-white shadow-glow hover:bg-violet-400">
                Export JSON
              </button>
            </div>

            <div className="rounded-2xl border border-white/10 bg-ink-850 p-5">
              <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-cyan-500/10 text-cyan-300">
                <Icon name="upload" size={18} />
              </div>
              <h3 className="mt-3 text-sm font-semibold text-white">Import progress</h3>
              <p className="mt-1 text-xs text-zinc-500">Restore from a previously exported JSON file.</p>
              <input ref={fileRef} type="file" accept="application/json,.json" className="hidden"
                onChange={e => { handleImport(e.target.files[0]); e.target.value = ''; }} />
              <button onClick={() => fileRef.current?.click()}
                className="mt-3 w-full rounded-xl border border-white/15 px-4 py-2.5 text-sm font-medium text-zinc-300 hover:bg-white/5">
                Choose JSON file
              </button>
              {importError && <p className="mt-2 text-[11px] text-rose-400">{importError}</p>}
            </div>
          </div>

          {/* Reset */}
          <div className="rounded-2xl border border-rose-500/20 bg-rose-500/[0.03] p-5">
            <h3 className="text-sm font-semibold text-rose-200">Reset all progress</h3>
            <p className="mt-1 text-xs text-zinc-500">This removes all statuses, notes, mistakes and streaks, and restores the original syllabus. Export first if you want a backup.</p>
            <button onClick={() => setConfirmReset(true)}
              className="mt-3 rounded-xl bg-rose-500/90 px-4 py-2 text-sm font-semibold text-white hover:bg-rose-400">
              Reset tracker
            </button>
          </div>

          {confirmReset && (
            <Modal open onClose={() => setConfirmReset(false)} title="Reset all progress?">
              <p className="text-sm text-zinc-400">This cannot be undone. All chapter statuses, notes, test scores and streaks will be cleared.</p>
              <div className="mt-4 flex justify-end gap-2">
                <button onClick={() => setConfirmReset(false)} className="rounded-xl border border-white/10 px-4 py-2 text-sm text-zinc-400 hover:bg-white/5">Cancel</button>
                <button onClick={() => { onReset(); setConfirmReset(false); }} className="rounded-xl bg-rose-500 px-4 py-2 text-sm font-semibold text-white hover:bg-rose-400">Yes, reset</button>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    /* ============================================================
       8. MAIN APP
    ============================================================ */
    function App() {
      const [state, setState] = useState(loadState);
      const [view, setView] = useState('dashboard');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);
      const [subjectFilter, setSubjectFilter] = useState('all');
      const [statusFilter, setStatusFilter] = useState('all');
      const [groupFilter, setGroupFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [editingChapter, setEditingChapter] = useState(null);

      // Persist on every change
      useEffect(() => { saveState(state); }, [state]);

      const chapters = state.chapters;

      const updateChapter = useCallback((id, patch) => {
        setState(prev => ({
          ...prev,
          chapters: prev.chapters.map(c =>
            c.id === id ? { ...c, ...patch, lastUpdated: new Date().toISOString() } : c
          ),
        }));
      }, []);

      const toggleStatus = useCallback((chapterId, key) => {
        setState(prev => {
          const chapters = prev.chapters.map(c => {
            if (c.id !== chapterId) return c;
            return {
              ...c,
              status: { ...c.status, [key]: !c.status[key] },
              lastUpdated: new Date().toISOString(),
            };
          });
          const streak = bumpStreak(prev.streak);
          return { ...prev, chapters, streak };
        });
      }, []);

      const moveChapter = useCallback((id, direction) => {
        setState(prev => {
          const chapter = prev.chapters.find(c => c.id === id);
          if (!chapter) return prev;
          const siblings = prev.chapters
            .filter(c => c.subjectId === chapter.subjectId)
            .sort((a, b) => a.order - b.order);
          const index = siblings.findIndex(c => c.id === id);
          const swapWith = siblings[index + direction];
          if (!swapWith) return prev;
          return {
            ...prev,
            chapters: prev.chapters.map(c => {
              if (c.id === chapter.id) return { ...c, order: swapWith.order };
              if (c.id === swapWith.id) return { ...c, order: chapter.order };
              return c;
            }),
          };
        });
      }, []);

      const saveChapter = (form) => {
        setState(prev => {
          const exists = prev.chapters.some(c => c.id === form.id);
          if (exists) {
            return {
              ...prev,
              chapters: prev.chapters.map(c => c.id === form.id ? { ...c, ...form, lastUpdated: new Date().toISOString() } : c),
            };
          }
          const maxOrder = prev.chapters
            .filter(c => c.subjectId === form.subjectId)
            .reduce((max, c) => Math.max(max, c.order), -1);
          const newChapter = {
            ...form,
            id: uid(),
            order: maxOrder + 1,
            lastUpdated: new Date().toISOString(),
          };
          return { ...prev, chapters: [...prev.chapters, newChapter] };
        });
        setEditingChapter(null);
      };

      const deleteChapter = (chapter) => {
        if (!window.confirm(`Delete "${chapter.name}"? This cannot be undone.`)) return;
        setState(prev => ({ ...prev, chapters: prev.chapters.filter(c => c.id !== chapter.id) }));
      };

      const resetAll = () => {
        try { localStorage.removeItem(STORAGE_KEY); } catch {}
        setState(createInitialState());
        setView('dashboard');
      };

      const newChapter = () => {
        setEditingChapter({
          id: '',
          subjectId: 'math',
          group: '',
          name: '',
          topics: [],
          weightage: 2,
          notes: '',
          testScore: null,
          testDate: null,
          mistakes: '',
          mistakesResolved: false,
          nextAction: '',
          status: emptyStatus(),
          revisionHistory: [],
          order: 0,
          lastUpdated: new Date().toISOString(),
        });
      };

      const renderView = () => {
        switch (view) {
          case 'dashboard':
            return <Dashboard state={state} chapters={chapters} setView={setView} setSubjectFilter={setSubjectFilter} />;
          case 'chapters':
            return (
              <ChaptersView
                state={state} chapters={chapters}
                subjectFilter={subjectFilter} setSubjectFilter={setSubjectFilter}
                statusFilter={statusFilter} setStatusFilter={setStatusFilter}
                groupFilter={groupFilter} setGroupFilter={setGroupFilter}
                searchQuery={searchQuery} setSearchQuery={setSearchQuery}
                onToggleStatus={toggleStatus}
                onEdit={ch => setEditingChapter(ch)}
                onDelete={deleteChapter}
                onMove={moveChapter}
                onNew={newChapter}
              />
            );
          case 'mission':
            return <NextMission state={state} chapters={chapters} setState={setState} />;
          case 'mistakes':
            return <MistakeTracker chapters={chapters} onToggleResolved={id => updateChapter(id, { mistakesResolved: !chapters.find(c => c.id === id)?.mistakesResolved })} onEdit={ch => setEditingChapter(ch)} />;
          case 'revisions':
            return <RevisionLog chapters={chapters} />;
          case 'settings':
            return <Settings state={state} setState={setState} chapters={chapters} onReset={resetAll} />;
          default:
            return null;
        }
      };

      return (
        <div className="min-h-screen bg-ink-950">
          <Sidebar
            state={state} view={view} setView={setView}
            collapsed={sidebarCollapsed} setCollapsed={setSidebarCollapsed}
            mobileOpen={mobileSidebarOpen} setMobileOpen={setMobileSidebarOpen}
          />

          <div className={cn('transition-all duration-300', sidebarCollapsed ? 'lg:pl-20' : 'lg:pl-64')}>
            {/* Mobile top bar */}
            <div className="sticky top-0 z-30 flex items-center justify-between border-b border-white/10 bg-ink-950/80 px-4 py-3 backdrop-blur lg:hidden">
              <button onClick={() => setMobileSidebarOpen(true)} className="rounded-lg p-2 text-zinc-400 hover:bg-white/5">
                <Icon name="menu" size={20} />
              </button>
              <div className="flex items-center gap-2">
                <Icon name="target" size={16} className="text-violet-400" />
                <span className="text-sm font-semibold text-white">CBSE 10 Tracker</span>
              </div>
              <div className="flex items-center gap-1 rounded-full bg-white/[0.04] px-2 py-1 text-[11px] text-zinc-400">
                <Icon name="flame" size={12} className="text-orange-400" /> {state.streak.current}
              </div>
            </div>

            <main className="mx-auto max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
              {renderView()}
            </main>
          </div>

          {/* Chapter editor modal */}
          {editingChapter && (
            <ChapterModal
              chapter={editingChapter}
              onClose={() => setEditingChapter(null)}
              onSave={saveChapter}
            />
          )}
        </div>
      );
    }

    /* ============================================================
       9. RENDER
    ============================================================ */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
